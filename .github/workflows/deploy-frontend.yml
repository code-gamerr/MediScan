name: Deploy Frontend to Azure Static Web Apps

# Manual only — keeps GitHub Actions + Azure quiet on routine pushes/PRs.
# Actions → Deploy Frontend → Run workflow when you intentionally ship.
on:
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-mobile

      - name: Build Android APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL=https://medscan-api.azurewebsites.net \
            --dart-define=MEDSCAN_API_KEY=${{ secrets.VITE_MEDSCAN_API_KEY }}

      - name: Copy APK into frontend public
        working-directory: frontend
        run: npm run copy:apk

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_MEDSCAN_API_KEY: ${{ secrets.VITE_MEDSCAN_API_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_OMNIDIMENSION_WIDGET_SECRET: ${{ vars.VITE_OMNIDIMENSION_WIDGET_SECRET }}
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          skip_app_build: true
